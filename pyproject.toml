[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports...), I: import order,
# B: common bug patterns, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]