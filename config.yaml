# Tham số chạy. Mọi thay đổi ở đây đi qua commit (sau này là PR + eval).
llm:
  temperature: 0        # 0 = ổn định, cần cho eval
  max_tokens: 2048      # trần token ra (gồm cả token suy nghĩ) để chặn chi phí
  timeout_s: 30
  max_retries: 3

prompt:
  version: answer_v0    # file prompts/answer_v0.txt