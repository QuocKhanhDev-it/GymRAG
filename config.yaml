# Runtime tunables. Every change goes through a commit (later: PR + eval).
llm:
  temperature: 0        # 0 = stable output, needed for eval
  max_tokens: 2048      # cap on output tokens (incl. thinking) to bound cost
  timeout_s: 30
  max_retries: 3

prompt:
  version: answer_v1    # prompts/answer_v1.txt